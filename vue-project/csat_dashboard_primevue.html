<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <title>لوحة تحليل الاستطلاعات - AI Powered</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/primevue@4/umd/primevue.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/primeuix@1/umd/primeuix.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/primeuix@1/themes/aura-light-green/theme.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 2.5em;
            font-weight: bold;
        }

        .subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .action-section {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .input-group {
            flex: 1;
            min-width: 200px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #2c3e50;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }

        .analyze-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            align-self: flex-end;
        }

        .analyze-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .analyze-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-left: 10px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .synthesis-section {
            background: #f0f9ff;
            border-right: 4px solid #3b82f6;
            padding: 20px;
            margin-bottom: 30px;
            border-radius: 10px;
        }

        .synthesis-section h2 {
            color: #1e40af;
            margin-bottom: 15px;
            font-size: 1.5em;
        }

        .synthesis-content {
            color: #1e293b;
            line-height: 1.8;
            white-space: pre-wrap;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 30px;
            margin-bottom: 30px;
        }

        .chart-container {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .chart-title {
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 1.3em;
            font-weight: bold;
            text-align: center;
        }

        .error-message {
            background: #fee2e2;
            border-right: 4px solid #ef4444;
            padding: 15px;
            border-radius: 8px;
            color: #991b1b;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 1.8em;
            }

            .action-section {
                flex-direction: column;
            }

            .analyze-btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div id="app">
        <div class="container">
            <h1>📊 لوحة تحليل الاستطلاعات بالذكاء الاصطناعي</h1>
            <p class="subtitle">تحليل شامل مدعوم بالذكاء الاصطناعي</p>

            <!-- Action Section -->
            <div class="action-section">
                <div class="input-group">
                    <label>رقم الاستطلاع:</label>
                    <input v-model="surveyId" type="text" placeholder="مثال: S25120024" />
                </div>
                <div class="input-group">
                    <label>معرف الجلسة:</label>
                    <input v-model="sessionId" type="text" placeholder="معرف فريد للجلسة" />
                </div>
                <button class="analyze-btn" @click="fetchAnalysis" :disabled="loading || !surveyId">
                    {{ loading ? 'جاري التحليل...' : 'تحليل الاستطلاع' }}
                    <span v-if="loading" class="loading-spinner"></span>
                </button>
            </div>

            <!-- Error Message -->
            <div v-if="errorMessage" class="error-message">
                {{ errorMessage }}
            </div>

            <!-- Synthesis Section -->
            <div v-if="synthesis" class="synthesis-section">
                <h2>📝 التحليل التنفيذي</h2>
                <div class="synthesis-content">{{ synthesis }}</div>
            </div>

            <!-- Dynamic Charts -->
            <div v-if="dynamicCharts.length > 0" class="charts-grid">
                <div v-for="(chart, index) in dynamicCharts" :key="index" class="chart-container">
                    <h3 class="chart-title">{{ chart.title }}</h3>
                    <canvas :ref="'chart-' + index"></canvas>
                </div>
            </div>

            <!-- No Data Message -->
            <div v-if="!loading && !synthesis && dynamicCharts.length === 0"
                style="text-align: center; padding: 40px; color: #6b7280;">
                <p style="font-size: 1.2em;">👆 اختر استطلاع وابدأ التحليل</p>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, nextTick } = Vue;

        const app = createApp({
            setup() {
                const surveyId = ref('S25120024');
                const sessionId = ref('B6F10FAC-A20E-4A77-B52C-CBC472679163');
                const loading = ref(false);
                const synthesis = ref('');
                const dynamicCharts = ref([]);
                const errorMessage = ref('');
                const chartInstances = ref([]);

                const fetchAnalysis = async () => {
                    if (!surveyId.value) {
                        errorMessage.value = 'الرجاء إدخال رقم الاستطلاع';
                        return;
                    }

                    loading.value = true;
                    errorMessage.value = '';
                    synthesis.value = '';

                    // Destroy existing charts
                    chartInstances.value.forEach(chart => chart.destroy());
                    chartInstances.value = [];
                    dynamicCharts.value = [];

                    try {
                        const response = await fetch('http://localhost:5566/survey_insight', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({
                                request: {
                                    message: '',
                                    survey_id: surveyId.value,
                                    session_id: sessionId.value
                                }
                            })
                        });

                        if (!response.ok) {
                            throw new Error(`HTTP error! status: ${response.status}`);
                        }

                        const data = await response.json();

                        // Set synthesis text
                        synthesis.value = data.synthesis || 'لا يوجد تحليل متاح';

                        // Set dynamic charts
                        dynamicCharts.value = data.charts || [];

                        // Wait for DOM update then render charts
                        await nextTick();
                        renderCharts();

                    } catch (error) {
                        console.error('Error fetching analysis:', error);
                        errorMessage.value = `حدث خطأ أثناء جلب التحليل: ${error.message}`;
                    } finally {
                        loading.value = false;
                    }
                };

                const renderCharts = () => {
                    dynamicCharts.value.forEach((chartConfig, index) => {
                        const canvasElements = document.querySelectorAll(`[data-v-app] canvas`);
                        const canvas = canvasElements[index];

                        if (canvas) {
                            const ctx = canvas.getContext('2d');
                            const chartInstance = new Chart(ctx, {
                                type: chartConfig.type,
                                data: chartConfig.data,
                                options: chartConfig.options || {
                                    responsive: true,
                                    maintainAspectRatio: true
                                }
                            });
                            chartInstances.value.push(chartInstance);
                        }
                    });
                };

                return {
                    surveyId,
                    sessionId,
                    loading,
                    synthesis,
                    dynamicCharts,
                    errorMessage,
                    fetchAnalysis
                };
            }
        });

        app.mount('#app');
    </script>

</body>

</html>
