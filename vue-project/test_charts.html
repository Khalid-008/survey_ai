<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار لوحة التحليل — Snapshot Mode</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #0a0e1a;
            --surface: #111827;
            --surface2: #1a2235;
            --border: #1e2d45;
            --text: #e2e8f0;
            --muted: #64748b;
            --accent: #3b82f6;
            --green: #10b981;
            --red: #ef4444;
            --amber: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 50% at 20% 10%, rgba(59, 130, 246, 0.07) 0%, transparent 60%),
                radial-gradient(ellipse 60% 40% at 80% 80%, rgba(16, 185, 129, 0.05) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        .wrapper {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 24px;
        }

        /* ── Header ── */
        header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeDown 0.7s ease both;
        }

        header .eyebrow {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 3px;
            color: var(--accent);
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        header h1 {
            font-size: clamp(24px, 4vw, 40px);
            font-weight: 900;
            background: linear-gradient(135deg, #e2e8f0 30%, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
            margin-bottom: 8px;
        }

        header p {
            color: var(--muted);
            font-size: 14px;
        }

        /* ── Input Section ── */
        .input-section {
            display: flex;
            gap: 14px;
            margin-bottom: 36px;
            padding: 20px 24px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            align-items: flex-end;
            flex-wrap: wrap;
            animation: fadeUp 0.6s 0.1s ease both;
        }

        .input-group {
            flex: 1;
            min-width: 200px;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: var(--muted);
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .input-group input {
            width: 100%;
            padding: 10px 14px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: var(--accent);
        }

        .input-group input::placeholder {
            color: var(--muted);
        }

        .analyze-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            color: #fff;
            border: none;
            padding: 11px 28px;
            border-radius: 10px;
            font-family: 'Cairo', sans-serif;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.2s, box-shadow 0.2s;
            white-space: nowrap;
        }

        .analyze-btn:hover:not(:disabled) {
            opacity: 0.92;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.35);
        }

        .analyze-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        /* ── Error ── */
        .error-box {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.4);
            border-radius: 12px;
            padding: 14px 18px;
            color: #fca5a5;
            margin-bottom: 24px;
            font-size: 14px;
        }

        /* ── Report Sections ── */
        .report-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 28px;
            animation: fadeUp 0.6s 0.15s ease both;
        }

        @media (max-width: 800px) {
            .report-grid {
                grid-template-columns: 1fr;
            }
        }

        .report-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 22px;
            transition: border-color 0.2s;
        }

        .report-card:hover {
            border-color: rgba(59, 130, 246, 0.3);
        }

        .report-card.full-span {
            grid-column: 1 / -1;
        }

        .report-card h2 {
            font-size: 13px;
            font-weight: 700;
            color: var(--muted);
            margin-bottom: 14px;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .report-card h2::before {
            content: '';
            width: 4px;
            height: 14px;
            background: var(--accent);
            border-radius: 2px;
            display: inline-block;
        }

        .report-card.green h2::before {
            background: var(--green);
        }

        .report-card.amber h2::before {
            background: var(--amber);
        }

        .report-text {
            color: #cbd5e1;
            line-height: 1.85;
            font-size: 14px;
            white-space: pre-wrap;
        }

        .badge-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .badge {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 5px 14px;
            font-size: 13px;
            color: var(--text);
        }

        .rec-list {
            list-style: none;
        }

        .rec-list li {
            display: flex;
            gap: 10px;
            align-items: flex-start;
            padding: 9px 12px;
            margin-bottom: 6px;
            background: rgba(245, 158, 11, 0.07);
            border-radius: 8px;
            font-size: 13px;
            color: #fde68a;
            border: 1px solid rgba(245, 158, 11, 0.15);
        }

        .rec-num {
            font-weight: 800;
            color: var(--amber);
            min-width: 22px;
        }

        /* ── Accordion ── */
        .accordion {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 16px;
            transition: border-color .2s;
        }

        .accordion:hover {
            border-color: rgba(59, 130, 246, .3);
        }

        .accordion.green .acc-header::before {
            background: var(--green);
        }

        .accordion.amber .acc-header::before {
            background: var(--amber);
        }

        .acc-header {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: transparent;
            border: none;
            cursor: pointer;
            color: var(--muted);
            font-family: 'Cairo', sans-serif;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: .5px;
            gap: 8px;
        }

        .acc-header::before {
            content: '';
            width: 4px;
            height: 14px;
            background: var(--accent);
            border-radius: 2px;
            flex-shrink: 0;
        }

        .acc-header span:first-child {
            flex: 1;
            text-align: right;
        }

        .acc-arrow {
            font-size: 16px;
            transition: transform .3s;
        }

        .accordion.open .acc-arrow {
            transform: rotate(180deg);
        }

        .acc-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height .35s ease, padding .35s ease;
            padding: 0 20px;
        }

        .accordion.open .acc-body {
            max-height: 2000px;
            padding: 0 20px 18px;
        }

        /* metrics+recs side by side */
        .report-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0;
            margin-bottom: 16px;
            align-items: start;
        }

        .report-grid .accordion {
            margin-bottom: 0;
            border-radius: 0;
        }

        .report-grid .accordion:first-child {
            border-radius: 16px 0 0 16px;
            border-right: none;
        }

        .report-grid .accordion:last-child {
            border-radius: 0 16px 16px 0;
        }

        @media (max-width: 700px) {
            .report-grid {
                grid-template-columns: 1fr;
            }

            .report-grid .accordion:first-child {
                border-radius: 16px 16px 0 0;
                border-right: 1px solid var(--border);
                border-bottom: none;
            }

            .report-grid .accordion:last-child {
                border-radius: 0 0 16px 16px;
            }
        }

        /* ── Charts grid ── */
        .charts-header {
            font-size: 13px;
            font-weight: 700;
            color: var(--muted);
            letter-spacing: .5px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .charts-header::before {
            content: '';
            width: 4px;
            height: 14px;
            background: var(--green);
            border-radius: 2px;
            display: inline-block;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 20px;
            margin-bottom: 32px;
        }

        .chart-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px;
            transition: border-color 0.2s, box-shadow 0.2s;
            animation: fadeUp 0.6s ease both;
        }

        .chart-card:hover {
            border-color: rgba(59, 130, 246, 0.3);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        /* span classes — se ajustan al tipo de gráfico */
        .chart-card.span-6 {
            grid-column: span 6;
        }

        .chart-card.span-4 {
            grid-column: span 4;
        }

        .chart-card.span-8 {
            grid-column: span 8;
        }

        .chart-card.span-12 {
            grid-column: span 12;
        }

        @media (max-width: 900px) {

            .chart-card.span-6,
            .chart-card.span-4,
            .chart-card.span-8 {
                grid-column: span 12;
            }
        }

        .chart-card-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--muted);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chart-card-title::before {
            content: '';
            width: 4px;
            height: 14px;
            background: var(--accent);
            border-radius: 2px;
            display: inline-block;
        }

        /* Circular charts — constrain size */
        .chart-wrap.circular {
            max-width: 300px;
            margin: 0 auto;
        }

        /* Height driven by JS via --h CSS variable */
        .chart-wrap {
            position: relative;
            width: 100%;
            height: var(--h, 260px);
        }

        /* ── Smart masonry charts grid ── */
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 20px;
            margin-bottom: 32px;
            align-items: start;
        }

        .chart-card {
            grid-column: span var(--cols, 6);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px;
            transition: border-color 0.2s, box-shadow 0.2s;
            animation: fadeUp 0.55s ease both;
        }

        .chart-card:hover {
            border-color: rgba(59, 130, 246, 0.3);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
        }

        .chart-card-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--muted);
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chart-card-title::before {
            content: '';
            width: 4px;
            height: 14px;
            background: var(--accent);
            border-radius: 2px;
        }

        @media (max-width: 900px) {
            .chart-card {
                grid-column: span 12 !important;
            }
        }

        /* ── Empty / Loading ── */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--muted);
            animation: fadeUp 0.6s ease both;
        }

        .empty-state .icon {
            font-size: 56px;
            margin-bottom: 16px;
        }

        .empty-state p {
            font-size: 16px;
        }

        /* ── Loading overlay ── */
        .loading-state {
            text-align: center;
            padding: 80px 20px;
            animation: fadeUp 0.4s ease both;
        }

        .loading-ring {
            width: 56px;
            height: 56px;
            border: 4px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        .loading-state p {
            color: var(--muted);
            font-size: 15px;
        }

        /* ── Animations ── */
        @keyframes fadeDown {
            from {
                opacity: 0;
                transform: translateY(-16px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .chart-card:nth-child(1) {
            animation-delay: 0.05s;
        }

        .chart-card:nth-child(2) {
            animation-delay: 0.12s;
        }

        .chart-card:nth-child(3) {
            animation-delay: 0.18s;
        }

        .chart-card:nth-child(4) {
            animation-delay: 0.24s;
        }

        .chart-card:nth-child(5) {
            animation-delay: 0.30s;
        }

        .chart-card:nth-child(6) {
            animation-delay: 0.36s;
        }
    </style>
</head>

<body>
    <div id="app">
        <div class="wrapper">

            <!-- Header -->
            <header>
                <div class="eyebrow">Test Environment — Snapshot Mode</div>
                <h1>🧪 اختبار لوحة التحليل الكاملة</h1>
                <p>يشغّل synthesis_agent + generate_charts_agent من الـ snapshot مباشرةً</p>
            </header>

            <!-- Run button -->
            <div class="input-section">
                <button class="analyze-btn" @click="fetchAnalysis" :disabled="loading">
                    <span v-if="loading" class="spinner"></span>
                    <span>{{ loading ? 'جاري التحليل...' : '▶ تشغيل التحليل من الـ Snapshot' }}</span>
                </button>
            </div>

            <!-- Error -->
            <div v-if="errorMessage" class="error-box">⚠️ {{ errorMessage }}</div>

            <!-- Loading -->
            <div v-if="loading" class="loading-state">
                <div class="loading-ring"></div>
                <p>يجري تحليل الاستطلاع بواسطة الذكاء الاصطناعي…</p>
            </div>

            <!-- Report Sections: accordion, populated by JS -->
            <div id="reportSections" style="display:none">

                <!-- Executive Summary -->
                <div class="accordion" id="acc-summary" style="display:none">
                    <button class="acc-header" onclick="toggleAcc('acc-summary')">
                        <span>📌 الملخص التنفيذي</span><span class="acc-arrow">▾</span>
                    </button>
                    <div class="acc-body">
                        <div id="acc-summary-content" class="report-text"></div>
                    </div>
                </div>

                <!-- Detailed Analysis -->
                <div class="accordion" id="acc-detail" style="display:none">
                    <button class="acc-header" onclick="toggleAcc('acc-detail')">
                        <span>📋 التحليل التفصيلي</span><span class="acc-arrow">▾</span>
                    </button>
                    <div class="acc-body">
                        <div id="acc-detail-content" class="report-text"></div>
                    </div>
                </div>

                <!-- Synthesis fallback -->
                <div class="accordion" id="acc-synthesis" style="display:none">
                    <button class="acc-header" onclick="toggleAcc('acc-synthesis')">
                        <span>📝 التحليل</span><span class="acc-arrow">▾</span>
                    </button>
                    <div class="acc-body">
                        <div id="acc-synthesis-content" class="report-text"></div>
                    </div>
                </div>

                <!-- Metrics -->
                <div class="accordion green" id="acc-metrics" style="display:none">
                    <button class="acc-header" onclick="toggleAcc('acc-metrics')">
                        <span>📈 المؤشرات الرئيسية</span><span class="acc-arrow">▾</span>
                    </button>
                    <div class="acc-body">
                        <div id="acc-metrics-content" class="badge-list"></div>
                    </div>
                </div>

                <!-- Recommendations -->
                <div class="accordion amber" id="acc-recs" style="display:none">
                    <button class="acc-header" onclick="toggleAcc('acc-recs')">
                        <span>💡 التوصيات</span><span class="acc-arrow">▾</span>
                    </button>
                    <div class="acc-body">
                        <ul id="acc-recs-content" class="rec-list"></ul>
                    </div>
                </div>

            </div>

            <!-- Empty State -->
            <div v-if="!loading && !dataLoaded && !errorMessage" class="empty-state">
                <div class="icon">🔬</div>
                <p>جاري التحميل...</p>
            </div>

        </div>
    </div>

    <!-- Charts section: OUTSIDE Vue entirely so it always exists in DOM -->
    <div class="wrapper" style="padding-top:0">
        <div id="chartsSection" style="display:none">
            <div class="charts-header">📊 الرسوم البيانية التحليلية</div>
            <div id="chartsMasonry" class="charts-grid"></div>
        </div>
    </div>

    <script>
        // ── Chart.js Defaults ──────────────────────────────────────────────────────
        Chart.defaults.font.family = 'Cairo';
        Chart.defaults.color = '#94a3b8';

        const { createApp, ref, computed, nextTick } = Vue;

        createApp({
            setup() {
                const loading = ref(false);
                const errorMessage = ref('');
                const dataLoaded = ref(false);

                // Structured report fields
                const executiveSummary = ref('');
                const detailedAnalysis = ref('');
                const keyMetrics = ref([]);
                const recommendations = ref([]);
                const synthesis = ref('');

                // Charts
                const dynamicCharts = ref([]);
                const chartInstances = ref([]);

                const hasData = computed(() =>
                    executiveSummary.value || detailedAnalysis.value ||
                    synthesis.value || dynamicCharts.value.length > 0
                );

                const formattedDetailedAnalysis = computed(() => {
                    if (!detailedAnalysis.value) return '';
                    return detailedAnalysis.value
                        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                        .replace(/\n/g, '<br/>');
                });

                // ── Chart utilities (shared with smartLayout) ─────────────────────────
                const normalizeType = (chart) => {
                    if (chart.type === 'horizontalBar') return 'bar';
                    if (chart.type === 'combo') return 'bar';
                    return chart.type;
                };

                const buildChartConfig = (chart) => {
                    const type = normalizeType(chart);
                    const options = JSON.parse(JSON.stringify(chart.options || {}));
                    options.responsive = true;
                    options.maintainAspectRatio = false;
                    if (chart.type === 'horizontalBar') options.indexAxis = 'y';
                    if (options.plugins?.tooltip?.callbacks) delete options.plugins.tooltip.callbacks;
                    if (options.scales)
                        for (const a of Object.values(options.scales)) {
                            if (a.grid) a.grid.color = '#1e2d45';
                            if (a.ticks) a.ticks.color = '#94a3b8';
                            if (a.angleLines) a.angleLines.color = '#1e2d45';
                        }
                    if (type === 'radar') {
                        options.scales = options.scales || {};
                        options.scales.r = {
                            ...(options.scales.r || {}),
                            grid: { color: '#1e2d45' }, angleLines: { color: '#1e2d45' },
                            pointLabels: { color: '#94a3b8', font: { size: 11 } },
                            ticks: { backdropColor: 'transparent', color: '#94a3b8' }
                        };
                    }
                    if (type === 'polarArea') {
                        options.scales = options.scales || {};
                        options.scales.r = {
                            ...(options.scales.r || {}),
                            grid: { color: '#1e2d45' }, ticks: { backdropColor: 'transparent', color: '#94a3b8' }
                        };
                    }
                    if (type === 'bar') {
                        options.scales = options.scales || {};
                        options.scales.x = { ...(options.scales.x || {}), grid: { color: '#1e2d45' }, ticks: { color: '#94a3b8' } };
                        options.scales.y = { ...(options.scales.y || {}), grid: { color: '#1e2d45' }, ticks: { color: '#94a3b8' }, beginAtZero: true };
                    }
                    options.plugins = options.plugins || {};
                    options.plugins.legend = {
                        ...(options.plugins.legend || {}),
                        labels: { color: '#94a3b8', padding: 16, font: { size: 12 } }
                    };
                    if (type === 'doughnut') options.cutout = options.cutout ?? '62%';
                    const datasets = (chart.data?.datasets || []).map(ds => ({
                        ...ds,
                        borderRadius: type === 'bar' ? 8 : undefined,
                        hoverOffset: ['doughnut', 'pie'].includes(type) ? 10 : undefined,
                        borderColor: (ds.borderColor === '#fff' || !ds.borderColor) ? '#111827' : ds.borderColor,
                    }));
                    return { type, data: { ...chart.data, datasets }, options };
                };

                // ── Smart layout engine ────────────────────────────────────────────────
                const smartLayout = (charts) => {
                    const labelCount = c => (c.data?.labels || []).length;
                    const sized = charts.map(chart => {
                        const t = normalizeType(chart), lc = labelCount(chart);
                        let cols, h, circular = false;
                        if (t === 'doughnut' || t === 'pie') { cols = 4; h = 300; circular = true; }
                        else if (t === 'polarArea') { cols = 5; h = 340; }
                        else if (t === 'radar') { if (lc <= 4) { cols = 4; h = 280; circular = true; } else { cols = 5; h = 320; } }
                        else if (t === 'bar' && chart.type === 'horizontalBar') {
                            if (lc <= 5) { cols = 6; h = Math.max(220, lc * 46); } else if (lc <= 10) { cols = 8; h = Math.max(260, lc * 42); } else { cols = 12; h = Math.max(340, lc * 38); }
                        } else if (t === 'bar') {
                            if (lc <= 5) { cols = 6; h = 260; } else if (lc <= 10) { cols = 8; h = 300; } else { cols = 12; h = 340; }
                        } else if (t === 'line') { cols = 8; h = 280; }
                        else { cols = 6; h = 280; }
                        return { chart, cols, h, circular };
                    });
                    const packed = []; let i = 0;
                    while (i < sized.length) {
                        const cur = sized[i];
                        if (cur.cols >= 12) { packed.push({ ...cur, cols: 12 }); i++; continue; }
                        const rowItems = [cur]; let used = cur.cols, j = i + 1;
                        while (j < sized.length && used + sized[j].cols <= 12) { rowItems.push(sized[j]); used += sized[j].cols; j++; }
                        const remaining = 12 - used;
                        if (rowItems.length === 1) { packed.push({ ...cur, cols: 12 }); i++; }
                        else {
                            if (remaining > 0) {
                                const nc = rowItems.filter(x => !x.circular);
                                const per = Math.floor(remaining / Math.max(nc.length, 1));
                                rowItems.forEach(x => { if (!x.circular) x.cols += per; });
                                const leftover = 12 - rowItems.reduce((s, x) => s + x.cols, 0);
                                const last = [...rowItems].reverse().find(x => !x.circular);
                                if (last) last.cols += leftover;
                            }
                            rowItems.forEach(x => packed.push(x)); i = j;
                        }
                    }
                    return packed;
                };

                // ── Render all charts with smart layout ───────────────────────────────
                const renderCharts = (charts) => {
                    // Destroy previous instances
                    chartInstances.value.forEach(c => c.destroy());
                    chartInstances.value = [];

                    const section = document.getElementById('chartsSection');
                    const masonry = document.getElementById('chartsMasonry');

                    if (!charts.length) {
                        if (section) section.style.display = 'none';
                        return;
                    }

                    // Show section & clear previous cards
                    if (section) section.style.display = 'block';
                    masonry.innerHTML = '';

                    const layout = smartLayout(charts);
                    layout.forEach(({ chart, cols, h, circular }, idx) => {
                        const card = document.createElement('div');
                        card.className = 'chart-card';
                        card.style.setProperty('--cols', cols);

                        const title = document.createElement('div');
                        title.className = 'chart-card-title';
                        title.textContent = chart.title || `مخطط ${idx + 1}`;
                        card.appendChild(title);

                        const wrap = document.createElement('div');
                        wrap.className = `chart-wrap${circular ? ' circular' : ''}`;
                        wrap.style.setProperty('--h', h + 'px');

                        const canvas = document.createElement('canvas');
                        canvas.id = `chart-canvas-${idx}`;
                        wrap.appendChild(canvas);
                        card.appendChild(wrap);
                        masonry.appendChild(card);

                        try {
                            const inst = new Chart(canvas, buildChartConfig(chart));
                            chartInstances.value.push(inst);
                        } catch (e) {
                            console.error(`Chart ${idx}:`, e);
                            wrap.innerHTML = `<p style="color:#ef4444;font-size:12px;text-align:center;padding-top:60px">⚠️ ${e.message}</p>`;
                        }
                    });
                };


                // ── Populate accordion sections (pure DOM) ────────────────────────────
                const populateSections = (data) => {
                    const show = (id, html, isHtml = false) => {
                        const el = document.getElementById(id);
                        const acc = document.getElementById(id.replace('-content', ''));
                        if (!el || !acc) return;
                        if (isHtml) el.innerHTML = html; else el.textContent = html;
                        acc.style.display = '';
                        acc.classList.add('open'); // open by default
                    };

                    const reportSections = document.getElementById('reportSections');
                    if (reportSections) reportSections.style.display = 'block';

                    if (data.executive_summary) show('acc-summary-content', data.executive_summary);
                    if (data.detailed_analysis) {
                        const html = data.detailed_analysis
                            .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                            .replace(/\n/g, '<br/>');
                        show('acc-detail-content', html, true);
                    }
                    if (!data.executive_summary && data.synthesis) show('acc-synthesis-content', data.synthesis);

                    const metricsRow = document.getElementById('acc-metrics-row');
                    if (data.key_metrics?.length) {
                        const el = document.getElementById('acc-metrics-content');
                        if (el) el.innerHTML = data.key_metrics
                            .map(m => `<span class="badge">${m}</span>`).join('');
                        const acc = document.getElementById('acc-metrics');
                        if (acc) { acc.style.display = ''; acc.classList.add('open'); }
                    }
                    if (data.recommendations?.length) {
                        const el = document.getElementById('acc-recs-content');
                        if (el) el.innerHTML = data.recommendations
                            .map((r, i) => `<li><span class="rec-num">${i + 1}.</span><span>${r}</span></li>`).join('');
                        const acc = document.getElementById('acc-recs');
                        if (acc) { acc.style.display = ''; acc.classList.add('open'); }
                    }
                };

                // ── Fetch from snapshot (test_full endpoint) ───────────────────────────
                const fetchAnalysis = async () => {
                    loading.value = true;
                    errorMessage.value = '';

                    // Reset accordion sections
                    ['acc-summary', 'acc-detail', 'acc-synthesis', 'acc-metrics', 'acc-recs'].forEach(id => {
                        const el = document.getElementById(id);
                        if (el) { el.style.display = 'none'; el.classList.remove('open'); }
                    });
                    const rs = document.getElementById('reportSections');
                    if (rs) rs.style.display = 'none';
                    const cs = document.getElementById('chartsSection');
                    if (cs) cs.style.display = 'none';

                    try {
                        const response = await fetch('http://localhost:5566/test_full');
                        if (!response.ok) throw new Error(`HTTP ${response.status}`);
                        const data = await response.json();
                        console.log('✅ snapshot response:', data);

                        populateSections(data);
                        renderCharts(data.charts || []);
                        dataLoaded.value = true;

                    } catch (err) {
                        console.error('Fetch error:', err);
                        errorMessage.value = `حدث خطأ: ${err.message}`;
                    } finally {
                        loading.value = false;
                    }
                };

                // Auto-run on load
                fetchAnalysis();

                return { loading, errorMessage, dataLoaded, fetchAnalysis };
            }
        }).mount('#app');

        // Accordion toggle (global — called from onclick in HTML)
        function toggleAcc(id) {
            const el = document.getElementById(id);
            if (el) el.classList.toggle('open');
        }
    </script>
</body>
